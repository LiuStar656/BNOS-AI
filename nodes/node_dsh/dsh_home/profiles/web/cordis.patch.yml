# billion-context-dsh：禁用 preset realm 的 compaction-basic（ACP 模型驱动后端接管压缩决策）
- id: compaction-basic
  disabled: true

# harness-pet：桌面宠物默认关闭（设置 → 插件 → 管理 可一键开启）
- id: harness-pet
  disabled: true
