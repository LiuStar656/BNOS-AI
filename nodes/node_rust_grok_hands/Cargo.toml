[package]
name = "node_rust_grok_hands"
version = "0.1.0"
edition = "2021"
description = "BNOS Rust Grok Hands - MCP 工具执行器"

[[bin]]
name = "node_rust_grok_hands"
path = "src/main.rs"

[[bin]]
name = "node_rust_grok_hands_listener"
path = "src/listener.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
